<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — ProductX</title>
  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav id="site-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="aboutus.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="portfolio.html">Portfolio</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contactus.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main class="contact-container">
    <h1>Contact Us</h1>
    <div class="contact-details">
      <div>
        <h2>Get in Touch</h2>
        <p>Email: <a href="mailto:support@productx.com">support@productx.com</a></p>
        <p>Phone: <a href="tel:+1234567890">+1 (234) 567‑890</a></p>
        <p>Address: 123 Startup Lane, Tech City, USA</p>
        <div class="social-icons">
          <a href="#"><i class="fab fa-facebook-f"></i></a>
          <a href="#"><i class="fab fa-twitter"></i></a>
          <a href="#"><i class="fab fa-linkedin-in"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="message">Message</label>
        <textarea id="message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
    <div class="map-container">
      <iframe src="https://www.google.com/maps/embed?pb=..." width="100%" height="300" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', e => {
      e.preventDefault();
      alert('Your message has been sent!');
    });
  </script>

  <footer id="footer">
    <p>&copy; 2025 ProductX Corp. All rights reserved.</p>
    <a href="index.html" class="back-link">&#8592; Back to Home</a>
  </footer>
</body>
</html>
