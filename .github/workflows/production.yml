name: Production Deployment

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out the code
      - uses: actions/checkout@v3

      

      # 2) Set up Node.js environment
      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3) Install dependencies
      - name: Install dependencies
        run: npm ci
      - name: chmod something 
        run: chmod +x node_modules/.bin/stylelint

      # 4) Lint HTML files
      - name: Lint HTML
        run: npx htmlhint '**/*.html' --config .htmlhintrc.json

      # 5) Lint CSS files
      - name: Lint CSS
        run: npx stylelint '**/*.css' --config .stylelintrc.json

      # 6) Build production assets
      - name: Build
        run: npm run build

      # 7) (Optional) Run smoke tests
      - name: Run smoke tests
        if: ${{ always() }}
        run: npm run test:smoke

      # 8) Deploy to production environment
      - name: Deploy to production
        run: echo "Deploying to production-env"
        # Replace with your real deploy command, e.g.
        # npm run deploy:prod
        # or a provider action like:
        # uses: JamesIves/github-pages-deploy-action@v4
        #   with:
        #     branch: gh-pages
        #     folder: build
